spring:
  datasource:
    url: jdbc:h2:mem:renewal-agent-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always

app:
  seed:
    enabled: true
  agent:
    inline: true
    llm:
      mode: deterministic
  queue:
    mode: inline
  lock:
    mode: local
